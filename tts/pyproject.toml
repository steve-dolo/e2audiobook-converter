[project]
name = "ebooks-tts"
version = "0.1.0"
description = "EPUB -> M4B audiobook with local Kokoro TTS"
requires-python = ">=3.10,<3.13"
dependencies = [
    "kokoro>=0.9.4",
    "misaki[en]>=0.9.4",
    "soundfile",
    "numpy",
    "ebooklib>=0.18",
    "beautifulsoup4",
    "imageio-ffmpeg>=0.6",
    # misaki loads this spaCy model at runtime; pin it so it doesn't pip-install on first use
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
